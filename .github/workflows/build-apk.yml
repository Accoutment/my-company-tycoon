name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MyCompanyTycoon.apk
      - uses: actions/upload-artifact@v4
        with: { name: MyCompanyTycoon-apk, path: MyCompanyTycoon.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MyCompanyTycoon APK (latest)
          files: MyCompanyTycoon.apk
